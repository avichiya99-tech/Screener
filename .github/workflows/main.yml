name: Daily NIFTY DCF & Dividend Update

on:
  schedule:
    # 11:00 UTC = 4:30 PM IST (Mon-Fri, after NSE 3:30 PM close)
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-screener:
    runs-on: ubuntu-latest
    env:
      MAX_STOCKS: "200"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily valuation pipeline
        run: python update_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_screener.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update daily NIFTY screener $(date +'%Y-%m-%d')"
          git push
